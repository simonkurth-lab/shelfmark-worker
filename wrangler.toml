name = "shelfmark-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Fill in with your existing KV namespace ID (Workers & Pages > KV in the
# Cloudflare dashboard, or `wrangler kv namespace list`).
[[kv_namespaces]]
binding = "SHELFMARK_KV"
id = "f326e343327f4213b8658908a8f68f84"

# Secrets (ANTHROPIC_API_KEY) are not stored here.
# Set them with: wrangler secret put ANTHROPIC_API_KEY

# Live group sessions: one Durable Object per class (strongly consistent, unlike KV).
[[durable_objects.bindings]]
name = "LIVE_ROOM"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]
