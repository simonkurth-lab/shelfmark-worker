name = "shelfmark-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Fill in with your existing KV namespace ID (Workers & Pages > KV in the
# Cloudflare dashboard, or `wrangler kv namespace list`).
[[kv_namespaces]]
binding = "SHELFMARK_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (ANTHROPIC_API_KEY) are not stored here.
# Set them with: wrangler secret put ANTHROPIC_API_KEY
